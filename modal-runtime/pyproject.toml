[project]
name = "modal-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rafael", email = "rafael.pierre@gmail.com" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "modal>=1.6.3",
]

[project.scripts]
modal-runtime = "modal_runtime:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
remote = [
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "reasoning-from-scratch",
    "setuptools>=82.0.1",
    "sympy>=1.14.0",
    "tokenizers>=0.21.2",
    "torch>=2.10,<3",
]

[tool.uv.sources]
reasoning-from-scratch = { workspace = true }
